### LLaMA-Factory DPO 配置：从 SFT adapter 继续
### 用法 llamafactory-cli train train/factory/dpo_lora.yaml
### 消融时改 pref_beta，输出目录用 OUTPUT_TAG 区分

### model
model_name_or_path: /root/autodl-tmp/models/Qwen3-8B
adapter_name_or_path: outputs/factory/sft_rank16_qvko
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
pref_beta: 0.1
pref_loss: sigmoid
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj

### dataset
dataset: ecom_dpo
dataset_dir: train/factory
template: qwen3
cutoff_len: 1024
preprocessing_num_workers: 8
overwrite_cache: true

### output
output_dir: outputs/factory/dpo_beta0.1
logging_steps: 10
save_steps: 200
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
report_to: none
